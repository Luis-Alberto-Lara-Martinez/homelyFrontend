<div class="min-h-screen flex flex-col font-sans relative">
  <!-- Layout Header -->
  <app-header *ngIf="showHeaderFooter"></app-header>

  <!-- Main Content Route -->
  <main class="flex-grow">
    <router-outlet></router-outlet>
  </main>

  <!-- Layout Footer -->
  <app-footer *ngIf="showHeaderFooter"></app-footer>


  <!-- Filtros SVG para Daltonismo Globales -->
  <svg style="display: none;">
    <defs>
      <!-- Protanopia (Rojo-Verde) -->
      <filter id="protanopia-filter">
        <feColorMatrix type="matrix"
          values="0.567, 0.433, 0, 0, 0  0.558, 0.442, 0, 0, 0  0, 0.242, 0.758, 0, 0  0, 0, 0, 1, 0" />
      </filter>
      <!-- Deuteranopia (Verde-Rojo) -->
      <filter id="deuteranopia-filter">
        <feColorMatrix type="matrix"
          values="0.625, 0.375, 0, 0, 0  0.7, 0.3, 0, 0, 0  0, 0.3, 0.7, 0, 0  0, 0, 0, 1, 0" />
      </filter>
      <!-- Tritanopia (Azul-Amarillo) -->
      <filter id="tritanopia-filter">
        <feColorMatrix type="matrix"
          values="0.95, 0.05, 0, 0, 0  0, 0.433, 0.567, 0, 0  0, 0.475, 0.525, 0, 0  0, 0, 0, 1, 0" />
      </filter>
    </defs>
  </svg>
</div>
